[project]
name = "task-1-voice-assistant"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "google-genai>=2.3.0",
    "nltk>=3.9.2",
    "pyaudio>=0.2.14",
    "pyttsx3>=2.99",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "speechrecognition>=3.17.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
